name: fluxone-bank-rail-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_bank_rail:/app/node_modules
      - npm_cache:/root/.npm

  bank-rail:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: '3004'
      RAIL_OUTCOME_WEIGHTS: ${RAIL_OUTCOME_WEIGHTS:-25,25,25,25}
      RAIL_TIMEOUT_DELAY_MS: ${RAIL_TIMEOUT_DELAY_MS:-15000}
      RAIL_LEDGER_PATH: /data/rail-ledger.jsonl
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - rail_data:/data
    ports:
      - '3004:3004'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3004/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  node_modules_bank_rail:
  npm_cache:
  rail_data:
