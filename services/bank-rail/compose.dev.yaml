name: fluxone-bank-rail-dev

services:
  dev:
    build:
      context: ../..
      dockerfile: services/bank-rail/Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - ../..:/app
      - node_modules_root:/app/node_modules
      - node_modules_bank_rail:/app/services/bank-rail/node_modules
      - npm_cache:/root/.npm

volumes:
  node_modules_root:
  node_modules_bank_rail:
  npm_cache:
