pre-commit:
  parallel: true
  commands:
    eslint:
      root: services/auth
      glob: '*.{ts,tsx,js,mjs}'
      run: npx eslint --max-warnings 0 --fix {staged_files}
      stage_fixed: true
    prettier:
      root: services/auth
      glob: '*.{ts,tsx,js,mjs,json,yml,yaml,md,css}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      root: services/auth
      glob: '*.{ts,tsx}'
      run: npm run typecheck
