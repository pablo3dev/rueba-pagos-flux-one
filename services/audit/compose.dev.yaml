name: fluxone-audit-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pw}
      POSTGRES_DB: fluxone
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit_dev_pw}
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fluxone}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_dev_pw}
      RABBITMQ_DEFAULT_VHOST: /fluxone
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    environment:
      DATABASE_URL: postgres://audit_svc:${AUDIT_DB_PASSWORD:-audit_dev_pw}@postgres:5432/fluxone
      AMQP_URL: amqp://${RABBITMQ_USER:-fluxone}:${RABBITMQ_PASSWORD:-rabbit_dev_pw}@rabbitmq:5672/%2Ffluxone
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth:3001/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-urn:fluxone:auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-urn:fluxone:api}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: '3003'
      DATABASE_URL: postgres://audit_svc:${AUDIT_DB_PASSWORD:-audit_dev_pw}@postgres:5432/fluxone
      AMQP_URL: amqp://${RABBITMQ_USER:-fluxone}:${RABBITMQ_PASSWORD:-rabbit_dev_pw}@rabbitmq:5672/%2Ffluxone
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:3001/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-urn:fluxone:auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-urn:fluxone:api}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3003/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  node_modules:
  npm_cache:
