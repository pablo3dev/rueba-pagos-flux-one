name: fluxone-payments-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pw}
      POSTGRES_DB: fluxone
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_dev_pw}
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: fluxone
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    environment:
      DATABASE_URL: postgres://payment_svc:${PAYMENT_DB_PASSWORD:-payment_dev_pw}@postgres:5432/fluxone
      JWKS_URL: ${JWKS_URL:-http://auth:3001/.well-known/jwks.json}
      RAIL_URL: ${RAIL_URL:-http://bank-rail:3004}
      RABBIT_URL: ${RABBIT_URL:-amqp://guest:guest@rabbitmq:5672/fluxone}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: '3002'
      DATABASE_URL: postgres://payment_svc:${PAYMENT_DB_PASSWORD:-payment_dev_pw}@postgres:5432/fluxone
      JWKS_URL: ${JWKS_URL:-http://auth:3001/.well-known/jwks.json}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth:3001/.well-known/jwks.json}
      RAIL_URL: ${RAIL_URL:-http://bank-rail:3004}
      RAIL_BASE_URL: ${RAIL_BASE_URL:-http://bank-rail:3004}
      RABBIT_URL: ${RABBIT_URL:-amqp://guest:guest@rabbitmq:5672/fluxone}
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3002/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  node_modules:
  npm_cache:
