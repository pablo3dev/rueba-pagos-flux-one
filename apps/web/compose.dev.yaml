name: fluxone-web-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    environment:
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-host.docker.internal:3001}
      PAYMENTS_UPSTREAM: ${PAYMENTS_UPSTREAM:-host.docker.internal:3002}
      AUDIT_UPSTREAM: ${AUDIT_UPSTREAM:-host.docker.internal:3003}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:80/']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dev:
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm

volumes:
  node_modules:
  npm_cache:
